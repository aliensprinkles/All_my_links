--bg-color: #020601;
--card-bg: #061404;

/* 18+ Age Gate Overlay with Jagged Theme */

.gate-box {
background-color: #081A05;
border: 10px solid #1e5c12;
padding: 40px;
max-width: 450px;
box-shadow: 0 0 25px rgba(43, 240, 8, 0.25);

.gate-title {

color: var(--slime-green);

 font-family: 'Almendra', serif;

.radio-group {

flex-direction: column;

max-width: 250px;
margin: 25px auto;
gap: 15px;
}

.radio-label {
font-size: 1.2rem;
cursor: pointer;
display: flex;
align-items: center;
gap: 10px;
user-select: none;
  color: #bbf2b3;
}

/* Radio Buttons */
.radio-label input[type="radio"] {
appearance: none;
-webkit-appearance: none;
width: 16px;
height: 16px;
border: 2px solid #299e19;
background-color: #030d02;
cursor: pointer;
display: inline-flex;
  align-items: center;
position: relative;
transform: rotate(45deg); /* Sharp diamond shapes */
transition: all 0.2s;
  outline: none;
}

.radio-label input[type="radio"]::before {
  content: "";
  width: 8px;
  height: 8px;
background-color: transparent;
  transition: background-color 0.2s;
}
  
.radio-label input[type="radio"]:checked {
box-shadow: 0 0 8px var(--slime-green);
border-color: #ffffff;
}

.radio-label input[type="radio"]:checked::before {
background-color: var(--slime-green);
}
  
.gate-btn {
font-family: 'IM Fell English SC', serif;
background-color: #0f3309;
color: white;
border: 1px solid var(--slime-green);
padding: 12px 40px;
font-size: 1.2rem;
cursor: pointer;
margin-top: 10px;
transition: all 0.3s;
clip-path: polygon(0 15%, 100% 0, 95% 100%, 5% 85%);
}

.gate-btn:hover {
background-color: var(--slime-green);
box-shadow: 0 0 15px var(--toxic-glow);
  color: #020601;
  border-color: #ffffff;
}

/* Main Content Styling */
.profile {
text-align: center;
margin-bottom: 40px;
}

.profile-img {
  width: 140px;
height: auto;
  max-width: 100%;
object-fit: contain;
  border-radius: 0px;
filter: drop-shadow(0px 0px 20px var(--toxic-glow));
}

/* Bottom GIF Style - Sharp, Jagged Punk Cutout Mask */

96% 38%, 100% 64%, 95% 82%, 100% 92%,
82% 100%, 62% 92%, 48% 98%, 24% 94%, 0% 100%,

.links-container {
width: 100%;
max-width: 420px;

flex-direction: column;
gap: 25px;

/* Sharp, Jagged Punk Gothic Boxes */

98% 35%, 100% 60%, 97% 85%, 100% 95%,
85% 100%, 65% 94%, 45% 98%, 20% 92%, 0% 100%,

/* hover transition */

background-color: #0f3309;

  color: var(--slime-green);
  text-shadow: 0 0 8px var(--slime-green);

.link-btn:active {

</style>

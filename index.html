--text-color: #ffffff;

--toxic-glow: #2bf008; /*FORMERLY NEON-GLOW*/

body {

color: var(--text-color);
display: flex;
flex-direction: column;
align-items: center;
padding: 40px 20px;
margin: 0;
min-height: 100vh;
  box-sizing: border-box;
  background-color: #020601;
  background-image: radial-gradient(circle, #020601 30%, #061404 70%, rgba(57, 255, 20, 0.15) 130%);
  background-attachment: fixed;
}

/* 18+ Age Gate Overlay with Jagged Theme */
#age-gate {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-color: #020601;
background-image: radial-gradient(circle, #020601 30%, #061404 70%, rgba(57, 255, 20, 0.15) 130%);
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
z-index: 9999;
text-align: center;
padding: 20px;
box-sizing: border-box;
}

.gate-box {
background-color: #061404;
border: 2px solid #1e5c12;
padding: 40px;
max-width: 450px;
box-shadow: 0 0 25px rgba(43, 240, 8, 0.25);
clip-path: polygon(2% 0%, 95% 4%, 100% 0%, 97% 45%, 100% 95%, 50% 97%, 3% 100%, 0% 70%, 2% 25%);
}

.gate-title {
font-size: 2rem;
color: var(--slime-green);
margin-top: 0;
text-transform: uppercase;
letter-spacing: 2px;
  text-shadow: 0 0 10px var(--toxic-glow);
}

.gate-box p {
  color: #a4c99e;
  font-size: 1.2rem;
  line-height: 1.5;
}
  
/* Gothic Radio Options Container */
.radio-group {
display: flex;
flex-direction: column;
align-items: flex-start;
max-width: 250px;
margin: 25px auto;
gap: 15px;
}

.radio-label {
font-size: 1.2rem;
cursor: pointer;
display: flex;
align-items: center;
gap: 10px;
user-select: none;
  color: #bbf2b3;
}

/* Radio Buttons */
.radio-label input[type="radio"] {
appearance: none;
-webkit-appearance: none;
width: 16px;
height: 16px;
border: 2px solid #299e19;
background-color: #030d02;
cursor: pointer;
display: inline-block;
position: relative;
transform: rotate(45deg); /* Sharp diamond shapes */
transition: all 0.2s;
}

.radio-label input[type="radio"]:checked {
background-color: var(--slime-green);
box-shadow: 0 0 8px var(--slime-green);
border-color: #ffffff;
}

.gate-btn {
font-family: 'IM Fell English', serif;
background-color: #0f3309;
color: white;
border: 1px solid var(--slime-green);
padding: 12px 40px;
font-size: 1.2rem;
cursor: pointer;
margin-top: 10px;
transition: all 0.3s;
clip-path: polygon(0 15%, 100% 0, 95% 100%, 5% 85%);
}

.gate-btn:hover {
background-color: var(--slime-green);
box-shadow: 0 0 15px var(--toxic-glow);
  color: #020601;
  border-color: #ffffff;
}

/* Main Content Styling */
.profile {
text-align: center;
margin-bottom: 40px;
}

.profile-img {
width: 145px;
height: 110px;
}

h1 {
font-size: 2.7rem;
margin: 15px 0 5px 0;
letter-spacing: 2px;
  color: var(--slime-green);
text-shadow: 0 0 10px var(--toxic-glow);
}

.bio {
font-size: 1.2rem;
color: #a4c99e;
margin: 0;
}

.links-container {
width: 100%;
max-width: 420px;
display: flex;
flex-direction: column;
gap: 25px;
}
      
/* Sharp, Jagged Punk Gothic Boxes */
.link-btn {
  display: block;
background-color: #0c2608;
color: var(--text-color);
text-decoration: none;
text-align: center;
padding: 20px;
font-size: 1.3rem;
letter-spacing: 1px;
cursor: pointer;
user-select: none;
border: 2px solid var(--border-chemical);
  
/* Tattered / ripped paper shape */
clip-path: polygon(
0% 8%, 15% 0%, 35% 6%, 55% 1%, 75% 8%, 88% 2%, 100% 10%,
98% 35%, 100% 60%, 97% 85%, 100% 95%,
85% 100%, 65% 94%, 45% 98%, 20% 92%, 0% 100%,
2% 70%, 0% 45%, 3% 20%

  transition: all 0.3s ease;
}

/* hover transition */
.link-btn:hover {
background-color: #0f3309;
  border-color: var(--slime-green);
  color: var(--slime-green);
  text-shadow: 0 0 8px var(--slime-green), 0 0 15px var(--toxic-glow);
  transform: scale(1.03) rotate(0.5deg);
}

.link-btn:active {
transform: scale(0.97);
}
</style>
</head>

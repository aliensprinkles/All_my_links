<!DOCTYPE html>

<head>

<title>My Links</title>

<!-- Import Gothic Font -->
<link rel="preconnect" href="https://googleapis.com">

<style>
:root {
--bg-color: #080303;
--card-bg: #120505;
--text-color: #ffffff;
--vamp-red: #8b0000;
--neon-glow: #ff0000;
}

body {
font-family: 'IM Fell English', serif;
background-color: var(--bg-color);
color: var(--text-color);
display: flex;
flex-direction: column;
align-items: center;
padding: 40px 20px;
margin: 0;
min-height: 100vh;
}

/* 18+ Age Gate Overlay with Jagged Theme */
#age-gate {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-color: #000000;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
z-index: 9999;
text-align: center;
padding: 20px;
box-sizing: border-box;
}

.gate-box {
background-color: var(--card-bg);
border: 2px solid var(--vamp-red);
padding: 40px;
max-width: 450px;
box-shadow: 0 0 20px rgba(139, 0, 0, 0.5);
clip-path: polygon(2% 0%, 95% 4%, 100% 0%, 97% 45%, 100% 95%, 50% 97%, 3% 100%, 0% 70%, 2% 25%);
}

.gate-title {
font-size: 2rem;
color: var(--neon-glow);
margin-top: 0;
text-transform: uppercase;
letter-spacing: 2px;
}

/* Gothic Radio Options Container */
.radio-group {
display: flex;
flex-direction: column;
align-items: flex-start;
max-width: 250px;
margin: 25px auto;
gap: 15px;
}

.radio-label {
font-size: 1.2rem;
cursor: pointer;
display: flex;
align-items: center;
gap: 10px;
user-select: none;
}

/* Vampire Styled Radio Buttons */
.radio-label input[type="radio"] {
appearance: none;
-webkit-appearance: none;
width: 16px;
height: 16px;
border: 2px solid var(--vamp-red);
background-color: #000;
cursor: pointer;
display: inline-block;
position: relative;
transform: rotate(45deg); /* Sharp diamond shapes */
transition: all 0.2s;
}

.radio-label input[type="radio"]:checked {
background-color: var(--neon-glow);
box-shadow: 0 0 8px var(--neon-glow);
border-color: #fff;
}

.gate-btn {
font-family: 'IM Fell English', serif;
background-color: var(--vamp-red);
color: white;
border: 1px solid #ff3333;
padding: 12px 40px;
font-size: 1.2rem;
cursor: pointer;
margin-top: 10px;
transition: all 0.3s;
clip-path: polygon(0 15%, 100% 0, 95% 100%, 5% 85%);
}

.gate-btn:hover {
background-color: #ff0000;
box-shadow: 0 0 15px var(--neon-glow);
}

/* Main Content Styling */
.profile {
text-align: center;
margin-bottom: 40px;
}

.profile-img {
width: 110px;
height: 110px;
object-fit: cover;
border: 2px solid var(--vamp-red);
box-shadow: 0 0 15px rgba(139, 0, 0, 0.3);
clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
}

h1 {
font-size: 2.5rem;
margin: 15px 0 5px 0;
letter-spacing: 2px;
text-shadow: 0 0 8px rgba(139, 0, 0, 0.7);
}

.bio {
font-size: 1.2rem;
color: #ffffff;
margin: 0;
font-style: italic;
}

.links-container {
width: 100%;
max-width: 420px;
display: flex;
flex-direction: column;
gap: 15px;
}

/* Sharp, Jagged Punk Gothic Boxes */
.link-btn {
background-color: var(--card-bg);
color: var(--text-color);
text-decoration: none;
text-align: center;
padding: 20px;
font-size: 1.25rem;
letter-spacing: 1px;
transition: all 0.2s ease-in-out;
border: 1px solid var(--vamp-red);
cursor: pointer;
user-select: none;

/* Tattered / ripped paper shape */
clip-path: polygon(
0% 8%, 15% 0%, 35% 6%, 55% 1%, 75% 8%, 88% 2%, 100% 10%,
98% 35%, 100% 60%, 97% 85%, 100% 95%,
85% 100%, 65% 94%, 45% 98%, 20% 92%, 0% 100%,
2% 70%, 0% 45%, 3% 20%
);
}

/* Intense Glowing Asymmetrical Neon Crimson Hover Effect */
.link-btn:hover {
background-color: #240909;
  border-color: var(--neon-glow);
filter: drop-shadow(0px 0px 8px var(--neon-glow)) drop-shadow(0px 0px 20px #ff3333);
text-shadow: 0 0 8px #fff, 0 0 15px var(--neon-glow);
transform: scale(1.02) rotate(0.5deg);
}

.link-btn:active {
filter: drop-shadow(0px 0px 25px var(--neon-glow));
transform: scale(0.98);
}
</style>
</head>
<body>

<!-- Age Gate Modal Overlay -->
<div id="age-gate">
<div class="gate-box">

</div>

<script>

</body>
</html>

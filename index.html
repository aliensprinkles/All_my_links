<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Blocks search engines from indexing the page if you list it in public bios -->
<meta name="robots" content="noindex, nofollow">
<title>My Links</title>

<!-- Import Gothic Font -->
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

<style>
:root {
--bg-color: #080303; /* Deep vampire black-red */
--card-bg: #120505; /* Velvet dark red-black container */
--text-color: #ffffff; /* Stark white readability */
--vamp-red: #8b0000; /* Dark blood red accent */
--neon-glow: #ff0000; /* Intense neon red glow */
}

body {
font-family: 'IM Fell English', serif;
background-color: var(--bg-color);
color: var(--text-color);
display: flex;
flex-direction: column;
align-items: center;
padding: 40px 20px;
margin: 0;
min-height: 100vh;
}

/* 18+ Age Gate Overlay */
#age-gate {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-color: #000000;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
z-index: 9999;
text-align: center;
padding: 20px;
box-sizing: border-box;
}

.gate-box {
background-color: var(--card-bg);
border: 2px solid var(--vamp-red);
padding: 40px;
border-radius: 12px;
max-width: 450px;
box-shadow: 0 0 20px rgba(139, 0, 0, 0.5);
}

.gate-title {
font-size: 2rem;
color: var(--neon-glow);
margin-top: 0;
text-transform: uppercase;
letter-spacing: 2px;
}

.gate-btn {
font-family: 'IM Fell English', serif;
background-color: var(--vamp-red);
color: white;
border: 1px solid #ff3333;
padding: 12px 30px;
font-size: 1.2rem;
cursor: pointer;
margin-top: 20px;
transition: all 0.3s;
border-radius: 4px;
}

.gate-btn:hover {
background-color: #ff0000;
box-shadow: 0 0 15px var(--neon-glow);
}

/* Main Content Styling */
.profile {
text-align: center;
margin-bottom: 40px;
}

.profile-img {
width: 110px;
height: 110px;
border-radius: 50%;
object-fit: cover;
border: 2px solid var(--vamp-red);
box-shadow: 0 0 15px rgba(139, 0, 0, 0.3);
}

h1 {
font-size: 2rem;
margin: 15px 0 5px 0;
letter-spacing: 1px;
text-shadow: 0 0 8px rgba(139, 0, 0, 0.7);
}

.bio {
font-size: 1.1rem;
color: #b09e9e;
margin: 0;
font-style: italic;
}

.links-container {
width: 100%;
max-width: 420px;
display: flex;
flex-direction: column;
gap: 20px;
}

/* Button Glow & Gothic Boxes */
.link-btn {
background-color: var(--card-bg);
color: var(--text-color);
text-decoration: none;
text-align: center;
padding: 18px;
border-radius: 6px;
font-size: 1.25rem;
letter-spacing: 1px;
transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
border: 1px solid var(--vamp-red);
cursor: pointer;
box-shadow: 0 2px 5px rgba(0,0,0,0.5);
user-select: none;
}

/* Neon Crimson Hover Effect */
.link-btn:hover {
border-color: var(--neon-glow);
box-shadow: 0 0 20px 5px var(--neon-glow), inset 0 0 8px rgba(255, 0, 0, 0.3);
text-shadow: 0 0 5px #fff;
transform: translateY(-2px);
}

/* Active click neon punch */
.link-btn:active {
box-shadow: 0 0 30px 10px var(--neon-glow);
transform: scale(0.98);
}
</style>
</head>
<body>

<!-- Age Gate Modal Overlay -->
<div id="age-gate">
<div class="gate-box">
<div class="gate-title">Restricted Territory</div>
<p>You must be 18 years of age or older to enter this domain. Proceed only if you are of legal adult age.</p>
<button class="gate-btn" onclick="grantEntry()">I am 18 or older</button>
</div>
</div>

<!-- Main Content -->
<div class="profile">
<img class="profile-img" src="https://unsplash.com" alt="Vampire Profile">
<h1>@YourUsername</h1>
<p class="bio">Welcome to the dark side of the web.</p>
</div>

<!-- Scrambled links triggered strictly via real click events to evade crawlers -->
<div class="links-container">
<div class="link-btn" onclick="unveilLink('aHR0cHM6Ly9lbmNvdW50ZXJzb2Z0aGVueXhraW5kLmNvbQ==')">My Website</div>
<div class="link-btn" onclick="unveilLink('aHR0cHM6Ly9vbmx5ZmFucy5jb20vYWxpZW4uc3ByaW5rbGVz')">OnlyFangs</div>
<div class="link-btn" onclick="unveilLink('aHR0cHM6Ly90cnlzdC5saW5rL2VzY29ydC9hbGllbi1zcHJpbmtsZXM=')">Ad Site</div>
<div class="link-btn" onclick="unveilLink('aHR0cHM6Ly94LmNvbS9hbGllbl9zcHJpbmtsZXM=')"> X / Twitter</div>
</div>

<script>
// Simple 18+ Access Control
function grantEntry() {
document.getElementById('age-gate').style.display = 'none';
}

// Anti-Crawler Security Decryptor (Base64 Decoding on Intentional Click)
function unveilLink(scrambledToken) {
// Web crawlers looking at the plain HTML source will only find the alphanumeric string hashes.
// It only evaluates to your true target location when a client executes a literal pointer tap.
const verifiedUrl = atob(scrambledToken);
window.open(verifiedUrl, '_blank');
}
</script>
</body>
</html>
